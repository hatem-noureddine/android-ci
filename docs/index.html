<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Android CI Box | hateum/android-ci-box</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Battle-tested, high-performance, rootless Android CI/CD Docker image with AGP 9.x, SDK 35/36/37, JDK 17/21, GMD, native multi-arch and AI Agent skills.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Docsify Themeable: Clean, Modern & Responsive Theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  
  <style>
    :root {
      --base-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --code-font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, Monaco, monospace;
      --theme-color: #1a73e8;
      --sidebar-width: 280px;
      --sidebar-nav-link-color: #3c4043;
      --sidebar-nav-link-color--hover: #1a73e8;
      --sidebar-nav-link-color--active: #1a73e8;
      --sidebar-nav-link-font-weight--active: 600;
      --heading-color: #202124;
      --content-max-width: 900px;
      --code-inline-background: #f1f3f4;
      --code-inline-color: #d93025;
      --code-block-background: #f8f9fa;
      --table-cell-padding: 10px 14px;
      --table-row-odd-background: #fafafa;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --base-background-color: #121212;
        --base-color: #e8eaed;
        --heading-color: #ffffff;
        --sidebar-background: #18191a;
        --sidebar-nav-link-color: #bdc1c6;
        --sidebar-nav-link-color--hover: #8ab4f8;
        --sidebar-nav-link-color--active: #8ab4f8;
        --theme-color: #8ab4f8;
        --code-inline-background: #282a2d;
        --code-inline-color: #f28b82;
        --code-block-background: #1e1f20;
        --table-row-odd-background: #1a1a1c;
      }
    }

    .markdown-section table {
      display: table;
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
    }

    .mermaid {
      background-color: transparent !important;
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin: 24px 0;
    }

    .card {
      border: 1px solid #dadce0;
      border-radius: 8px;
      padding: 18px;
      background: var(--code-block-background);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--theme-color);
    }

    .card h3 {
      margin-top: 0;
      font-size: 1.1rem;
      color: var(--heading-color);
    }

    .card p {
      font-size: 0.95rem;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div id="app">Loading Android CI Box documentation...</div>
  <script>
    window.$docsify = {
      name: 'Android CI Box',
      repo: 'https://github.com/hatem-noureddine/android-ci',
      loadSidebar: true,
      subMaxLevel: 2,
      loadNavbar: true,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search documentation...',
        noData: 'No results found',
        depth: 3
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true
      },
      markdown: {
        renderer: {
          code: function(code, lang) {
            if (lang === "mermaid") {
              return '<div class="mermaid">' + code + '</div>';
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      }
    };
  </script>
  <!-- Docsify Core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Docsify Themeable -->
  <script src="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
  <!-- Search Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <!-- Copy to Clipboard Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- Pagination Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <!-- Zoom Image Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <!-- Prism Syntax Highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-groovy.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-docker.min.js"></script>
  <!-- Mermaid.js Core -->
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
    mermaid.initialize({ startOnLoad: true, theme: 'default' });
    window.mermaid = mermaid;
  </script>
  <script>
    window.addEventListener('hashchange', function() {
      setTimeout(function() {
        if (window.mermaid) {
          window.mermaid.run({
            querySelector: '.mermaid'
          });
        }
      }, 200);
    });
  </script>
</body>
</html>
