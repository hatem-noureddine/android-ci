<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Android CI Box Documentation | hateum/android-ci-box</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Battle-tested, high-performance, rootless Android CI/CD Docker image with AGP 9.x, SDK 35/36/37, JDK 17/21, GMD, native multi-arch and AI Agent skills.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- Theme: Dark & Light responsive modern theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css">
  <style>
    :root {
      --theme-color: #0288d1;
    }
    .sidebar {
      font-size: 15px;
    }
    .markdown-section pre>code {
      font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, Monaco, monospace;
      font-size: 0.9em;
    }
    .markdown-section table {
      display: table;
      width: 100%;
    }
    .app-name-link img {
      width: 32px;
      vertical-align: middle;
      margin-right: 8px;
    }
    /* Mermaid diagram container styling */
    .mermaid {
      background-color: transparent !important;
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div id="app">Loading Android CI Box documentation...</div>
  <script>
    window.$docsify = {
      name: 'Android CI Box',
      repo: 'https://github.com/hatem-noureddine/android-ci',
      loadSidebar: true,
      subMaxLevel: 3,
      loadNavbar: true,
      auto2top: true,
      coverpage: false,
      executeScript: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search documentation...',
        noData: 'No results found',
        depth: 4
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true
      },
      markdown: {
        renderer: {
          code: function(code, lang) {
            if (lang === "mermaid") {
              return (
                '<div class="mermaid">' + code + "</div>"
              );
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      }
    };
  </script>
  <!-- Docsify Core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Search Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <!-- Copy to Clipboard Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- Pagination Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <!-- Zoom Image Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <!-- Dark/Light Theme Switcher Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"></script>
  <!-- Prism Syntax Highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-groovy.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-docker.min.js"></script>
  <!-- Mermaid.js Core -->
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
    mermaid.initialize({ startOnLoad: true, theme: 'default' });
    window.mermaid = mermaid;
  </script>
  <script>
    // Re-run Mermaid rendering on route change in Docsify SPA
    window.addEventListener('hashchange', function() {
      setTimeout(function() {
        if (window.mermaid) {
          window.mermaid.run({
            querySelector: '.mermaid'
          });
        }
      }, 250);
    });
  </script>
</body>
</html>
