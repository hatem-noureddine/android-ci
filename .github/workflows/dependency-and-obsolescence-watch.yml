name: Upstream Obsolescence & Dependency Watchdog

on:
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  ACTIONS_RUNNER_FORCE_NODE24: "true"

jobs:
  check-updates:
    name: Check Upstream Updates & Obsolescence
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run Universal Dependency & Actions Watchdog
        id: watchdog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/check-upstream-dependencies.py
          python3 scripts/check-upstream-dependencies.py --apply

      - name: Create or Update GitHub Issue Alert
        if: steps.watchdog.outputs.any_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_TITLE="⚠️ [Obsolescence Watch] New Upstream Releases Available"
          
          # Check if open issue already exists
          EXISTING_ISSUE=$(gh issue list --search "$ISSUE_TITLE in:title state:open" --json number --jq '.[0].number')

          REPORT_FILE="build/dependency-report.json"
          BODY=$(python3 -c "
          import json
          with open('$REPORT_FILE') as f:
              data = json.load(f)
          updates = [d for d in data if d.get('needs_update')]
          print('## 🔍 Automated Obsolescence & Upstream Dependency Report\n')
          print('The weekly watchdog has identified newer releases of upstream dependencies or GitHub Actions:\n')
          print('| Category | Component / Action | Container Current | Upstream Latest |')
          print('| :--- | :--- | :--- | :--- |')
          for u in updates:
              print(f'| {u[\"category\"]} | \`{u[\"name\"]}\` | \`{u[\"current\"]}\` | \`{u[\"latest\"]}\` |')
          print('\n### 🤖 Recommended Agent Action')
          print('1. Review and validate the automated pull request on branch \`chore/upstream-dependency-updates\`.')
          print('2. Verify local compilation: \`tests/test-image.sh\`.')
          print('3. Merge PR to trigger automated multi-arch release.')
          ")

          if [ -n "$EXISTING_ISSUE" ] && [ "$EXISTING_ISSUE" != "null" ]; then
            echo "Updating existing issue #$EXISTING_ISSUE..."
            gh issue edit "$EXISTING_ISSUE" --body "$BODY"
          else
            echo "Creating new GitHub Issue..."
            gh issue create \
              --title "$ISSUE_TITLE" \
              --body "$BODY" \
              --label "dependencies"
          fi

      - name: Create Automated Update Pull Request
        if: steps.watchdog.outputs.any_update == 'true'
        uses: peter-evans/create-pull-request@v8
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update upstream tools and dependencies"
          branch: "chore/upstream-dependency-updates"
          delete-branch: true
          title: "🤖 [Automated] Upstream Dependency Updates"
          body: |
            ## Automated Upstream Dependency Updates

            This automated pull request was generated by the **Universal Upstream Dependency & Actions Watchdog**.

            Compatible dependencies in `Dockerfile` and build scripts have been updated to their latest stable releases.

            Please review the changes and verify CI test suite execution before merging.
          labels: |
            dependencies
            automated-pr
