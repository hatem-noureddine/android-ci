name: CI Tests & Docker Hub Automated Release

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]

env:
  IMAGE_NAME: hateum/android-ci-box

jobs:
  # ============================================================================
  # Job 1: Static Analysis & Code Quality Linters
  # ============================================================================
  lint:
    name: Linters & Static Analysis
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run Hadolint (Dockerfile Linter)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
          failure-threshold: error

      - name: Run ShellCheck (Shell Scripts Linter)
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'
          ignore_paths: >-
            test_projects

      - name: Run Actionlint (GitHub Workflows Linter)
        uses: raven-actions/actionlint@v2

  # ============================================================================
  # Job 2: Build, Security Scan (Trivy) & Run Comprehensive Test Suite
  # ============================================================================
  test:
    name: Build, Security Scan & Test Suite
    needs: lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local test image
        id: build_image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      # --- Security: Automated Vulnerability Scanning (Trivy) ---
      - name: Run Trivy Vulnerability Scanner (SARIF Report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:test
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          exit-code: '0'

      - name: Upload Trivy Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'container-trivy'

      - name: Enforce Zero Unfixed Critical Vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:test
          format: 'table'
          severity: 'CRITICAL'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          exit-code: '1'

      # --- Integration Tests ---
      - name: Run Complete Test Suite in Container (Root mode)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/project \
            -w /project \
            ${{ env.IMAGE_NAME }}:test \
            /project/tests/test-image.sh

      - name: Test Non-Root / Hardened Runner Execution (UID 1000:0)
        run: |
          docker run --rm \
            --user 1000:0 \
            -v "${{ github.workspace }}":/project \
            -w /project \
            ${{ env.IMAGE_NAME }}:test \
            bash -c "ci-doctor --json && switch-jdk 17 && switch-jdk 21"

      - name: Test Arbitrary UID Execution (UID 1001:1001)
        run: |
          docker run --rm \
            --user 1001:1001 \
            -v "${{ github.workspace }}":/project \
            -w /project \
            ${{ env.IMAGE_NAME }}:test \
            bash -c "ci-doctor --json && switch-jdk 17 && switch-jdk 21"

  # ============================================================================
  # Job 3: Native Multi-Arch Parallel Build Matrix (amd64 on x86, arm64 on arm)
  # Builds both architectures at full native speed simultaneously!
  # ============================================================================
  build-platforms:
    name: Build Native (${{ matrix.platform }})
    needs: test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    environment: Docker
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check Docker Hub Credentials Availability
        id: check_creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
            echo "Docker Hub credentials detected."
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::warning ::Docker Hub secrets (DOCKERHUB_USERNAME / DOCKERHUB_TOKEN) are not configured."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Release Version
        id: version
        run: |
          RAW_VER=$(tr -d '[:space:]' < VERSION)
          echo "version=${RAW_VER}" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: ${RAW_VER}"

      - name: Resolve Platform Tags
        id: platform_tags
        run: |
          TAGS="ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}-${{ matrix.arch }}"
          if [ "${{ steps.check_creds.outputs.has_creds }}" = "true" ]; then
            TAGS="${TAGS}
          ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-${{ matrix.arch }}"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push native platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.platform_tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  # ============================================================================
  # Job 4: Create Multi-Arch Manifest Lists & Publish to Registries
  # Merges native amd64 & arm64 images in seconds without recompilation!
  # ============================================================================
  publish-manifest:
    name: Create & Publish Multi-Arch Manifests
    needs: [test, build-platforms]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    environment: Docker
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check Docker Hub Credentials Availability
        id: check_creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
            echo "Docker Hub credentials detected."
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::warning ::Docker Hub secrets (DOCKERHUB_USERNAME / DOCKERHUB_TOKEN) are not configured."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Release Version
        id: version
        run: |
          RAW_VER=$(tr -d '[:space:]' < VERSION)
          MAJOR=$(echo "$RAW_VER" | cut -d. -f1)
          MINOR=$(echo "$RAW_VER" | cut -d. -f2)
          {
            echo "version=${RAW_VER}"
            echo "major=${MAJOR}"
            echo "minor=${MAJOR}.${MINOR}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved release version: ${RAW_VER} (major: ${MAJOR}, minor: ${MAJOR}.${MINOR})"

      - name: Extract Docker metadata & Automated Multi-Tagging
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE_NAME }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.minor }},enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.major }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - name: Create and Push Multi-Arch Manifests
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DOCKERHUB_TAG_ARGS=()
          GHCR_TAG_ARGS=()
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            if [[ "$tag" == "${{ env.IMAGE_NAME }}:"* ]]; then
              DOCKERHUB_TAG_ARGS+=("-t" "$tag")
            elif [[ "$tag" == "ghcr.io/"* ]]; then
              GHCR_TAG_ARGS+=("-t" "$tag")
            fi
          done <<< "${{ steps.meta.outputs.tags }}"

          if [ "${{ steps.check_creds.outputs.has_creds }}" = "true" ]; then
            echo "Creating multi-arch manifest on Docker Hub..."
            docker buildx imagetools create "${DOCKERHUB_TAG_ARGS[@]}" \
              "${{ env.IMAGE_NAME }}:${VERSION}-amd64" \
              "${{ env.IMAGE_NAME }}:${VERSION}-arm64"
          fi

          echo "Creating multi-arch manifest on GHCR..."
          docker buildx imagetools create "${GHCR_TAG_ARGS[@]}" \
            "ghcr.io/${{ github.repository }}:${VERSION}-amd64" \
            "ghcr.io/${{ github.repository }}:${VERSION}-arm64"

      - name: Update Docker Hub Description & Overview
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.check_creds.outputs.has_creds == 'true'
        uses: peter-evans/dockerhub-description@v4.0.0
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}
          repository: ${{ env.IMAGE_NAME }}
          readme-filepath: ./docs/dockerhub-overview.md
          short-description: "Fast, rootless Android CI/CD image with AGP 9.x, SDK 35/36/37, JDK 17/21, GMD & Auto-Detection."

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Job Summary Dashboard
        if: always()
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          # 🚀 hateum/android-ci-box Release Summary (v${{ steps.version.outputs.version }})

          | Metric | Status / Value |
          | :--- | :--- |
          | **Release Version** | \`v${{ steps.version.outputs.version }}\` (SemVer Major: \`${{ steps.version.outputs.major }}\`, Minor: \`${{ steps.version.outputs.minor }}\`) |
          | **Architectures** | \`linux/amd64\`, \`linux/arm64\` (Native Multi-Arch Matrix) |
          | **Docker Hub** | [\`${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}\`](https://hub.docker.com/r/${{ env.IMAGE_NAME }}) |
          | **GHCR Mirror** | [\`ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}\`](https://github.com/${{ github.repository }}/pkgs/container/android-ci) |
          | **Security Verdict** | ✅ Zero unfixed critical CVEs (Trivy Scan Passed) |
          | **Core Stack** | AGP 9.4.1, Gradle 9.8.2, OpenJDK 17/21, Precompiled Ruby 4.0.9, Fastlane 2.241.2, Android SDK 35/36/37, Native GMD |
          EOF
