name: CI Tests & Docker Hub Automated Release

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]

env:
  IMAGE_NAME: hateum/android-ci-box

jobs:
  # ============================================================================
  # Job 1: Static Analysis & Code Quality Linters
  # ============================================================================
  lint:
    name: Linters & Static Analysis
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run Hadolint (Dockerfile Linter)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
          failure-threshold: error

      - name: Run ShellCheck (Shell Scripts Linter)
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'
          ignore_paths: >-
            test_projects

      - name: Run Actionlint (GitHub Workflows Linter)
        uses: raven-actions/actionlint@v2

      - name: Validate CI Templates YAML Syntax
        run: |
          python3 -m pip install --quiet pyyaml || true
          python3 -c "
          import yaml, glob, sys
          files = glob.glob('ci-templates/**/*.yml', recursive=True) + glob.glob('ci-templates/**/.gitlab-ci.yml', recursive=True)
          failed = False
          for f in files:
              try:
                  with open(f, 'r') as fp:
                      list(yaml.safe_load_all(fp))
                  print(f'✔ Valid YAML: {f}')
              except Exception as e:
                  print(f'✘ Invalid YAML: {f} -> {e}', file=sys.stderr)
                  failed = True
          if failed:
              sys.exit(1)
          "

  # ============================================================================
  # Job 2: Build, Security Scan (Trivy) & Run Comprehensive Test Suite
  # ============================================================================
  test:
    name: Build, Security Scan & Test Suite
    needs: lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local test image (Full target)
        id: build_image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: full
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Build local test image (Slim target validation)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: slim
          load: true
          tags: ${{ env.IMAGE_NAME }}:test-slim
          cache-from: type=gha,scope=amd64

      - name: Validate Slim Variant Execution
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:test-slim ci-doctor --json

      # --- Security: Automated Vulnerability Scanning (Trivy) ---
      - name: Run Trivy Vulnerability Scanner (SARIF Report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:test
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          exit-code: '0'

      - name: Upload Trivy Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'container-trivy'

      - name: Enforce Zero Unfixed Critical Vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:test
          format: 'table'
          severity: 'CRITICAL'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          exit-code: '1'

      # --- Integration Tests ---
      - name: Run Complete Test Suite in Container (Root mode)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/project \
            -w /project \
            ${{ env.IMAGE_NAME }}:test \
            /project/tests/test-image.sh

      - name: Test Non-Root / Hardened Runner Execution (UID 1000:0)
        run: |
          docker run --rm \
            --user 1000:0 \
            -v "${{ github.workspace }}":/project \
            -w /project \
            ${{ env.IMAGE_NAME }}:test \
            bash -c "ci-doctor --json && switch-jdk 17 && switch-jdk 21"

      - name: Test Arbitrary UID Execution (UID 1001:1001)
        run: |
          docker run --rm \
            --user 1001:1001 \
            -v "${{ github.workspace }}":/project \
            -w /project \
            ${{ env.IMAGE_NAME }}:test \
            bash -c "ci-doctor --json && switch-jdk 17 && switch-jdk 21"

  # ============================================================================
  # Job 3: Native Multi-Arch Parallel Build Matrix (amd64 on x86, arm64 on arm)
  # Builds both architectures at full native speed simultaneously!
  # ============================================================================
  build-platforms:
    name: Build Native (${{ matrix.platform }})
    needs: test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    environment: Docker
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check Docker Hub Credentials Availability
        id: check_creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
            echo "Docker Hub credentials detected."
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::warning ::Docker Hub secrets (DOCKERHUB_USERNAME / DOCKERHUB_TOKEN) are not configured."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Release Version
        id: version
        run: |
          RAW_VER=$(tr -d '[:space:]' < VERSION)
          echo "version=${RAW_VER}" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: ${RAW_VER}"

      - name: Resolve Platform Tags (Full and Slim Variants)
        id: platform_tags
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"

          # Full variant tags
          TAGS_FULL="ghcr.io/${{ github.repository }}:${VERSION}-${ARCH}"
          if [ "${{ steps.check_creds.outputs.has_creds }}" = "true" ]; then
            TAGS_FULL="${TAGS_FULL}
          ${{ env.IMAGE_NAME }}:${VERSION}-${ARCH}"
          fi

          # Slim variant tags
          TAGS_SLIM="ghcr.io/${{ github.repository }}:${VERSION}-slim-${ARCH}"
          if [ "${{ steps.check_creds.outputs.has_creds }}" = "true" ]; then
            TAGS_SLIM="${TAGS_SLIM}
          ${{ env.IMAGE_NAME }}:${VERSION}-slim-${ARCH}"
          fi

          {
            echo "tags_full<<EOF"
            echo "$TAGS_FULL"
            echo "EOF"
            echo "tags_slim<<EOF"
            echo "$TAGS_SLIM"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push native platform image (Slim target)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: slim
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.platform_tags.outputs.tags_slim }}
          cache-from: type=gha,scope=${{ matrix.arch }}-slim
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}-slim

      - name: Build and push native platform image (Full target)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: full
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.platform_tags.outputs.tags_full }}
          cache-from: |
            type=gha,scope=${{ matrix.arch }}-slim
            type=gha,scope=${{ matrix.arch }}-full
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}-full

      - name: Native Architecture Test Suite Verification (${{ matrix.arch }})
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Pulling native ${{ matrix.arch }} test image from GHCR..."
          IMAGE="ghcr.io/${{ github.repository }}:${VERSION}-slim-${{ matrix.arch }}"
          docker pull "$IMAGE"
          echo "Executing test-image.sh natively on ${{ matrix.os }} (${{ matrix.platform }})..."
          docker run --rm \
            -v "$(pwd):/project" \
            -w /project \
            "$IMAGE" \
            /project/tests/test-image.sh

  # ============================================================================
  # Job 4: Create Multi-Arch Manifest Lists & Publish to Registries
  # Merges native amd64 & arm64 images in seconds without recompilation!
  # ============================================================================
  publish-manifest:
    name: Create & Publish Multi-Arch Manifests
    needs: [test, build-platforms]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    environment: Docker
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check Docker Hub Credentials Availability
        id: check_creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
            echo "Docker Hub credentials detected."
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::warning ::Docker Hub secrets (DOCKERHUB_USERNAME / DOCKERHUB_TOKEN) are not configured."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Release Version
        id: version
        run: |
          RAW_VER=$(tr -d '[:space:]' < VERSION)
          MAJOR=$(echo "$RAW_VER" | cut -d. -f1)
          MINOR=$(echo "$RAW_VER" | cut -d. -f2)
          {
            echo "version=${RAW_VER}"
            echo "major=${MAJOR}"
            echo "minor=${MAJOR}.${MINOR}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved release version: ${RAW_VER} (major: ${MAJOR}, minor: ${MAJOR}.${MINOR})"

      - name: Extract Docker metadata for Full variant
        id: meta_full
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE_NAME }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.minor }},enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.major }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - name: Extract Docker metadata for Slim variant
        id: meta_slim
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE_NAME }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=slim,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }}-slim,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.minor }}-slim,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.major }}-slim,enable={{is_default_branch}}
            type=semver,pattern={{version}}-slim
            type=semver,pattern={{major}}.{{minor}}-slim
            type=semver,pattern={{major}}-slim
            type=sha,format=short,prefix=sha-,suffix=-slim

      - name: Create and Push Multi-Arch Manifests (Full and Slim)
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # --- 1. Full Multi-Arch Manifest ---
          DOCKERHUB_FULL_ARGS=()
          GHCR_FULL_ARGS=()
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            if [[ "$tag" == "${{ env.IMAGE_NAME }}:"* ]]; then
              DOCKERHUB_FULL_ARGS+=("-t" "$tag")
            elif [[ "$tag" == "ghcr.io/"* ]]; then
              GHCR_FULL_ARGS+=("-t" "$tag")
            fi
          done <<< "${{ steps.meta_full.outputs.tags }}"

          if [ "${{ steps.check_creds.outputs.has_creds }}" = "true" ]; then
            echo "Creating full multi-arch manifest on Docker Hub..."
            docker buildx imagetools create "${DOCKERHUB_FULL_ARGS[@]}" \
              "${{ env.IMAGE_NAME }}:${VERSION}-amd64" \
              "${{ env.IMAGE_NAME }}:${VERSION}-arm64"
          fi

          echo "Creating full multi-arch manifest on GHCR..."
          docker buildx imagetools create "${GHCR_FULL_ARGS[@]}" \
            "ghcr.io/${{ github.repository }}:${VERSION}-amd64" \
            "ghcr.io/${{ github.repository }}:${VERSION}-arm64"

          # --- 2. Slim Multi-Arch Manifest ---
          DOCKERHUB_SLIM_ARGS=()
          GHCR_SLIM_ARGS=()
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            if [[ "$tag" == "${{ env.IMAGE_NAME }}:"* ]]; then
              DOCKERHUB_SLIM_ARGS+=("-t" "$tag")
            elif [[ "$tag" == "ghcr.io/"* ]]; then
              GHCR_SLIM_ARGS+=("-t" "$tag")
            fi
          done <<< "${{ steps.meta_slim.outputs.tags }}"

          if [ "${{ steps.check_creds.outputs.has_creds }}" = "true" ]; then
            echo "Creating slim multi-arch manifest on Docker Hub..."
            docker buildx imagetools create "${DOCKERHUB_SLIM_ARGS[@]}" \
              "${{ env.IMAGE_NAME }}:${VERSION}-slim-amd64" \
              "${{ env.IMAGE_NAME }}:${VERSION}-slim-arm64"
          fi

          echo "Creating slim multi-arch manifest on GHCR..."
          docker buildx imagetools create "${GHCR_SLIM_ARGS[@]}" \
            "ghcr.io/${{ github.repository }}:${VERSION}-slim-amd64" \
            "ghcr.io/${{ github.repository }}:${VERSION}-slim-arm64"

      - name: Install Cosign (Sigstore Cryptographic Signer)
        uses: sigstore/cosign-installer@v3.8.1

      - name: Install Syft (SBOM Generator)
        uses: anchore/sbom-action/download-syft@v0.18.0

      - name: Generate SPDX Software Bill of Materials (SBOM)
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Generating comprehensive SPDX SBOM for full release v${VERSION}..."
          syft "ghcr.io/${{ github.repository }}:${VERSION}" -o spdx-json > "android-ci-box-${VERSION}.spdx.json"
          echo "Generating comprehensive SPDX SBOM for slim release v${VERSION}..."
          syft "ghcr.io/${{ github.repository }}:${VERSION}-slim" -o spdx-json > "android-ci-box-${VERSION}-slim.spdx.json"
          echo "SBOMs generated successfully."

      - name: Attest SBOM with Cosign
        env:
          COSIGN_YES: "true"
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Attesting full and slim in-toto SPDX SBOM on GHCR registry..."
          cosign attest --yes --type spdxjson \
            --predicate "android-ci-box-${VERSION}.spdx.json" \
            "ghcr.io/${{ github.repository }}:${VERSION}"
          cosign attest --yes --type spdxjson \
            --predicate "android-ci-box-${VERSION}-slim.spdx.json" \
            "ghcr.io/${{ github.repository }}:${VERSION}-slim"

      - name: Cryptographically Sign OCI Images with Cosign
        env:
          COSIGN_YES: "true"
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Signing GHCR multi-arch images (full & slim) with keyless Sigstore OIDC..."
          cosign sign --yes "ghcr.io/${{ github.repository }}:${VERSION}"
          cosign sign --yes "ghcr.io/${{ github.repository }}:latest"
          cosign sign --yes "ghcr.io/${{ github.repository }}:${VERSION}-slim"
          cosign sign --yes "ghcr.io/${{ github.repository }}:slim"

          if [ "${{ steps.check_creds.outputs.has_creds }}" = "true" ]; then
            echo "Signing Docker Hub multi-arch images (full & slim)..."
            cosign sign --yes "${{ env.IMAGE_NAME }}:${VERSION}" || true
            cosign sign --yes "${{ env.IMAGE_NAME }}:latest" || true
            cosign sign --yes "${{ env.IMAGE_NAME }}:${VERSION}-slim" || true
            cosign sign --yes "${{ env.IMAGE_NAME }}:slim" || true
          fi

      - name: Update Docker Hub Description & Overview
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.check_creds.outputs.has_creds == 'true'
        uses: peter-evans/dockerhub-description@v4.0.0
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}
          repository: ${{ env.IMAGE_NAME }}
          readme-filepath: ./docs/dockerhub-overview.md
          short-description: "Fast, rootless Android CI/CD image with AGP 9.x, SDK 35/36/37, JDK 17/21, GMD & Auto-Detection."

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            android-ci-box-${{ steps.version.outputs.version }}.spdx.json
            android-ci-box-${{ steps.version.outputs.version }}-slim.spdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Job Summary Dashboard
        if: always()
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          # 🚀 hateum/android-ci-box Release Summary (v${{ steps.version.outputs.version }})

          | Metric | Status / Value |
          | :--- | :--- |
          | **Release Version** | \`v${{ steps.version.outputs.version }}\` (SemVer Major: \`${{ steps.version.outputs.major }}\`, Minor: \`${{ steps.version.outputs.minor }}\`) |
          | **Image Variants** | \`full\` (Default with GMD Emulator) & \`slim\` (Lightweight compilation/linting) |
          | **Architectures** | \`linux/amd64\`, \`linux/arm64\` (Native Multi-Arch Matrix) |
          | **Docker Hub** | [\`${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}\`](https://hub.docker.com/r/${{ env.IMAGE_NAME }}) · [\`${{ env.IMAGE_NAME }}:slim\`](https://hub.docker.com/r/${{ env.IMAGE_NAME }}) |
          | **GHCR Mirror** | [\`ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}\`](https://github.com/${{ github.repository }}/pkgs/container/android-ci) |
          | **Security Verdict** | ✅ Zero unfixed critical CVEs (Trivy Scan Passed) |
          | **Supply Chain Security** | 🔏 Keyless Sigstore/Cosign Signed & SPDX SBOM Attested (Full & Slim) |
          | **Core Stack** | AGP 9.4.1, Gradle 9.8.2, OpenJDK 17/21, Precompiled Ruby 4.0.9, Fastlane 2.241.2, Android SDK 35/36/37, Native GMD |
          EOF
