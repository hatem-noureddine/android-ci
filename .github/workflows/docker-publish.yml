name: CI Tests & Docker Hub Automated Release

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]

env:
  IMAGE_NAME: hateum/android-ci-box

jobs:
  # ============================================================================
  # Job 1: Static Analysis & Code Quality Linters
  # ============================================================================
  lint:
    name: Linters & Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Hadolint (Dockerfile Linter)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
          failure-threshold: error

      - name: Run ShellCheck (Shell Scripts Linter)
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          ignore_paths: >-
            test_projects

      - name: Run Actionlint (GitHub Workflows Linter)
        uses: raven-actions/actionlint@v2

  # ============================================================================
  # Job 2: Build, Security Scan (Trivy) & Run Comprehensive Test Suite
  # ============================================================================
  test:
    name: Build, Security Scan & Test Suite
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local test image
        id: build_image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Security: Automated Vulnerability Scanning (Trivy) ---
      - name: Run Trivy Vulnerability Scanner (SARIF Report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:test
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'
          exit-code: '0'

      - name: Upload Trivy Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Enforce Zero Unfixed Critical Vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:test
          format: 'table'
          severity: 'CRITICAL'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          exit-code: '1'

      # --- Integration Tests ---
      - name: Run Complete Test Suite in Container (Root mode)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/project \
            -w /project \
            ${{ env.IMAGE_NAME }}:test \
            /project/tests/test-image.sh

      - name: Test Non-Root / Hardened Runner Execution (UID 1000:0)
        run: |
          docker run --rm \
            --user 1000:0 \
            -v "${{ github.workspace }}":/project \
            -w /project \
            ${{ env.IMAGE_NAME }}:test \
            ci-doctor

      - name: Test Arbitrary UID Execution (UID 1001:1001)
        run: |
          docker run --rm \
            --user 1001:1001 \
            -v "${{ github.workspace }}":/project \
            -w /project \
            ${{ env.IMAGE_NAME }}:test \
            ci-doctor

  # ============================================================================
  # Job 3: Multi-Arch Build & Automated Multi-Tag Release to Docker Hub
  # Only executes if all linters, tests & security scans pass!
  # ============================================================================
  publish:
    name: Publish Multi-Arch Image to Docker Hub
    needs: test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: Docker
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker Hub Credentials Availability
        id: check_creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
            echo "Docker Hub credentials detected."
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::warning ::Docker Hub secrets (DOCKERHUB_USERNAME / DOCKERHUB_TOKEN) are not configured. Skipping image push."
          fi

      - name: Set up QEMU (for multi-arch amd64 / arm64)
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve Release Version
        id: version
        run: |
          RAW_VER=$(tr -d '[:space:]' < VERSION)
          MAJOR=$(echo "$RAW_VER" | cut -d. -f1)
          MINOR=$(echo "$RAW_VER" | cut -d. -f2)
          {
            echo "version=${RAW_VER}"
            echo "major=${MAJOR}"
            echo "minor=${MAJOR}.${MINOR}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved release version: ${RAW_VER} (major: ${MAJOR}, minor: ${MAJOR}.${MINOR})"

      - name: Extract Docker metadata & Automated Multi-Tagging
        if: steps.check_creds.outputs.has_creds == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.minor }},enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.major }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - name: Build and push Multi-Arch Docker image
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
