name: CI Tests & Docker Hub Automated Release

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]

env:
  IMAGE_NAME: hateum/android-ci-box

jobs:
  # ============================================================================
  # Job 1: Build & Run Comprehensive Test Suite
  # ============================================================================
  test:
    name: Build & Run Test Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Complete Test Suite in Container (Root mode)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/project \
            -w /project \
            ${{ env.IMAGE_NAME }}:test \
            /project/tests/test-image.sh

      - name: Test Non-Root / Hardened Runner Execution (UID 1000:0)
        run: |
          docker run --rm \
            --user 1000:0 \
            -v "${{ github.workspace }}":/project \
            -w /project \
            ${{ env.IMAGE_NAME }}:test \
            ci-doctor

  # ============================================================================
  # Job 2: Multi-Arch Build & Publish to Docker Hub
  # Only executes if tests pass and on main branch or release tags
  # ============================================================================
  publish:
    name: Publish Multi-Arch Image to Docker Hub
    needs: test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker Hub Credentials Availability
        id: check_creds
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
            echo "Docker Hub credentials detected."
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "::warning ::Docker Hub secrets (DOCKERHUB_USERNAME / DOCKERHUB_TOKEN) are not configured. Skipping image push."
          fi

      - name: Set up QEMU (for multi-arch amd64 / arm64)
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        if: steps.check_creds.outputs.has_creds == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push Multi-Arch Docker image
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
